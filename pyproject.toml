[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GCPL"
version = "0.1.0"
description = "GCPL implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "torch>=2.2", "matplotlib>=3.8"]

[project.scripts]
gcpl = "gcpl.cli:main"

[tool.setuptools.packages.find]
include = ["gcpl*"]
